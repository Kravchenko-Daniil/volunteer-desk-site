
# Override поверх docker-compose.prod.yml: включает HTTPS для youngnart.ru.
#
# Запуск:
#   docker compose -f docker-compose.prod.yml -f docker-compose.https.yml up -d
#
# Сертификат должен быть уже выпущен (см. scripts/issue_cert.sh) — этот файл
# только подключает готовые сертификаты и настраивает их автопродление.

services:
  nginx:
    ports:
      - "443:443"
    volumes:
      # Тот же target-путь, что в docker-compose.prod.yml, — эта запись
      # заменяет монтирование deploy/nginx.docker.conf, а не добавляется к нему.
      - ./deploy/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    # certbot обновляет файлы сертификата на диске, но nginx держит старый в памяти.
    # Раз в 6 часов перечитываем конфигурацию, чтобы продлённый сертификат вступил в силу.
    command: >-
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Раз в 12 часов пытается продлить сертификат; certbot сам продлевает,
    # только если до истечения осталось <30 дней, поэтому частые попытки безопасны.
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!};
      done;'
    restart: unless-stopped

volumes:
  certbot_certs:
  certbot_www:
