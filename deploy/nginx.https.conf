upstream django_app {
    server web:8000;
}

# HTTP: обслуживает ACME-challenge для выпуска/продления сертификата,
# весь остальной трафик уводит на HTTPS.
server {
    listen 80;
    server_name youngnart.ru www.youngnart.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://youngnart.ru$request_uri;
    }
}

# www.youngnart.ru по HTTPS: 301 на домен без www.
server {
    listen 443 ssl;
    http2 on;
    server_name www.youngnart.ru;

    ssl_certificate /etc/letsencrypt/live/youngnart.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youngnart.ru/privkey.pem;

    return 301 https://youngnart.ru$request_uri;
}

# youngnart.ru по HTTPS: основной сервер.
server {
    listen 443 ssl;
    http2 on;
    server_name youngnart.ru;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/youngnart.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youngnart.ru/privkey.pem;

    location = /health/ {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /static/ {
        alias /srv/static/;
        expires 7d;
    }

    location /media/ {
        alias /srv/media/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://django_app;
    }
}
